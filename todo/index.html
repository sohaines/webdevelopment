<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
</head>
<body>
  <h1 style = "text-align: center" class="todo">To-Do List</h1>

  <h3>Add a task:</h3>
    <input id="task" placeholder="add task here..." type="text">
  <input id="date" type="date" placeholder="add date here...">
    <button id="add" onclick="new_task()" >Confirm</button>

  <h3>List of tasks:</h3>
  <div id="list">
  </div>

</body>

<style>
  h1 {
    color: royalblue;
    font-size: 50px;
    font-family: 'Courier New', Courier, serif;
    text-shadow: #12239e 3px 1px 1px;
    text-align: center;
    text-decoration-line: overline;
    text-decoration-color: dodgerblue;

  }

  h3 {
    color: royalblue;
    font-size: 25px;
  }

  body {
    background-color: aliceblue;
  }

  .task {
  color: dodgerblue;
  }

  .todo {
    border: 3px dodgerblue solid;
    padding: 10px;
    margin: 20px;
    background-color: skyblue;
  }
  .completed {
    text-decoration: line-through;
    opacity: 0.6;

  }

  #list > div {
      margin: 10px;
  }

</style>

<script>
    function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }

    function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }
    function create_task_element(task_name, date_name) {
        if (!task_name) return;

        let new_div = document.createElement("div");
        document.getElementById("list").appendChild(new_div);

        let checkbox = document.createElement("input");
        checkbox.setAttribute("type", "checkbox");
        new_div.appendChild(checkbox);

        let span = document.createElement("span");
        span.setAttribute("class", "task");
        span.innerText = task_name;
        new_div.appendChild(span);

        let date_span = document.createElement("span");
        date_span.innerText = " (" + date_name + ")";
        date_span.style.marginLeft = "10px";
        date_span.style.color = "gray";
        new_div.appendChild(date_span);

        checkbox.addEventListener("change", function () {
            if (this.checked) {
                span.classList.add("completed");
            } else {
                span.classList.remove("completed");
            }
        });

        let trash = document.createElement("span");
        trash.className = "trash";
        trash.innerText = "🗑️";
        trash.style.float = "right";
        trash.addEventListener("click", delete_task);
        new_div.appendChild(trash);
    }

    function new_task() {
        let task_input = document.getElementById('task');
        let date_input = document.getElementById('date');

        let task_name = task_input.value;
        let date_name = date_input.value;

        if (task_name === "") {
            return false;
        }


        let current_task_cookie = getCookie("task");
        setCookie("task", current_task_cookie + "|" + task_name, 15);


        let current_date_cookie = getCookie("date");
        setCookie("date", current_date_cookie + "|" + date_name, 15);


        create_task_element(task_name, date_name);


        task_input.value = "";
        date_input.value = "";
        task_input.focus();
    }

  function delete_task(e) {
    // console.log(e.target);
    e.target.parentElement.remove();

  }

    let current_cookie = getCookie("task");

    if (current_cookie !== "") {
        let tasks = current_cookie.split("|");

        for (let i = 0; i < tasks.length; i++) {
            create_task_element(tasks[i]);
        }
    }

</script>
</html>
