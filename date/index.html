<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date</title>
</head>
<body>
  <h1>Date</h1>
  <p>Days remaining: <span id="countdown"></span></p>
</body>

<script>
    let now = new Date();
    console.log("NOW:" + now);
    console.log(now.getTime());

    let then = new Date("2026-10-23T00:00:00");
    console.log("THEN:" + then);

    let diffInMs = then - now;
    let daysLeft = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

    document.getElementById("countdown").innerText = daysLeft;
</script>

</html>
