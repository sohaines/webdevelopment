<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Date</title>
</head>
<body>
  <h1>Date</h1>
</body>

<script>
    let now = new Date();
    console.log("NOW:" + now);
    console.log(now.getTime());

    let then = new Date(1776784713550);
    console.log("THEN:" + then);

    console.log((then - now) / 1000 / 60 / 60 / 24);
</script>

</html>
