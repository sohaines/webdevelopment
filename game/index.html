<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wordle</title>
</head>

<body>
<h1>Wordle</h1>
<label style="font-size:25px; color:dodgerblue;" for="word-select">Choose your game mode:</label>
<select id="word-select" class="game-mode">
  <option value="4">4 letters</option>
  <option value="5">5 letters</option>
  <option value="6">6 letters</option>
</select>

<div class="container" id="grid"></div>

<style>
  .container {
    display: grid;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }

  .container input {
    background-color: #f3f3f3;
    border: 3px solid #b8d8f4;
    padding: 10px;
    font-size: 30px;
    text-align: center;
    width: 50px;
    height: 50px;
    line-height: 50px;
    box-sizing: content-box;
  }

  h1 {
    font-size: 50px;
    font-family: 'Courier New', Courier, serif;
    text-shadow: #12239e 3px 1px 1px;
    text-align: center;
    border: 3px dodgerblue solid;
    padding: 10px;
    margin: 20px;
    background-color: skyblue;
    color: #cdebf6;
    animation: colorCycle 3s infinite;
  }

  @keyframes colorCycle {
    0%   { color: dodgerblue; }
    25%  { color: royalblue; }
    50%  { color: cornflowerblue; }
    75%  { color: skyblue; }
    100% { color: lightskyblue; }
  }

  .game-mode {
    color: dodgerblue;
    font-size: 18px;
  }
</style>

<script>
  const words = {
    4: ["cake", "frog", "lamp", "fish", "star", "bold", "cave", "desk", "edge", "fame",
      "glow", "haze", "iris", "jade", "keen", "loft", "mist", "norm", "oval", "pace",
      "quiz", "rust", "silk", "tame", "urge", "vast", "wand", "yarn", "zeal", "arch"],
    5: ["plant", "storm", "brick", "grape", "sword", "blaze", "chirp", "draft", "elder",
      "frost", "groan", "hedge", "inlet", "joust", "knack", "lunge", "merge", "notch",
      "olive", "perch", "quirk", "reign", "shelf", "thump", "umbra", "vapor", "waltz",
      "xenon", "yacht", "zonal", "crisp", "dwarf", "expel", "flint", "gripe"],
    6: ["castle", "planet", "bridge", "oyster", "frosty", "blight", "canopy", "dagger",
      "embark", "famine", "goblin", "hustle", "ignite", "jester", "knight", "locket",
      "mangle", "nebula", "pardon", "quartz", "rattle", "saddle", "tangle",
      "unfold", "vanish", "wither", "exotic", "yogurt", "zipper", "cactus", "dazzle",
      "elapse", "gallop", "humble"]
  };

  let targetWord = "";
  let currentRow = 0;

  const container = document.getElementById('grid');
  const select = document.getElementById('word-select');

  function buildGrid(wordLength) {
    currentRow = 0;
    targetWord = words[wordLength][Math.floor(Math.random() * words[wordLength].length)];
    container.innerHTML = '';
    container.style.gridTemplateColumns = `repeat(${wordLength}, auto)`;

    for (let row = 0; row < 6; row++) {
      for (let col = 0; col < wordLength; col++) {
        let cell = document.createElement('input');
        cell.type = 'text';
        cell.maxLength = 1;
        cell.id = `cell-${row}-${col}`;

        cell.addEventListener('input', function() {
          if (cell.value.length === 1) {
            let nextCell = document.getElementById(`cell-${row}-${col + 1}`);
            if (nextCell) nextCell.focus();
          }
        });

        cell.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && cell.value === '') {
            let prevCell = document.getElementById(`cell-${row}-${col - 1}`);
            if (prevCell) {
              prevCell.focus();
              prevCell.value = '';
            }
          }
          if (e.key === 'Enter') {
            submitGuess();
          }
        });

        container.appendChild(cell);
      }
    }
  }

  select.addEventListener('change', function() {
    buildGrid(parseInt(select.value));
  });

  function submitGuess() {
    const wordLength = parseInt(select.value);

    let guess = '';
    for (let col = 0; col < wordLength; col++) {
      guess += document.getElementById(`cell-${currentRow}-${col}`).value.toLowerCase();
    }

    if (guess.length < wordLength) {
      alert("Not enough letters!");
      return;
    }

    const target = targetWord.split('');
    const guessArr = guess.split('');
    const result = Array(wordLength).fill('grey');
    const targetUsed = Array(wordLength).fill(false);
    const guessUsed = Array(wordLength).fill(false);

    for (let i = 0; i < wordLength; i++) {
      if (guessArr[i] === target[i]) {
        result[i] = 'green';
        targetUsed[i] = true;
        guessUsed[i] = true;
      }
    }

    for (let i = 0; i < wordLength; i++) {
      if (guessUsed[i]) continue;
      for (let j = 0; j < wordLength; j++) {
        if (!targetUsed[j] && guessArr[i] === target[j]) {
          result[i] = 'yellow';
          targetUsed[j] = true;
          break;
        }
      }
    }

    for (let col = 0; col < wordLength; col++) {
      const cell = document.getElementById(`cell-${currentRow}-${col}`);
      cell.style.backgroundColor = result[col];
      cell.style.borderColor = result[col];
      cell.disabled = true;
    }

    if (guess === targetWord) {
      setTimeout(() => alert("You got it!"), 100);
      return;
    }

    currentRow++;

    if (currentRow >= 6) {
      setTimeout(() => alert(`Game over! The word was "${targetWord}"`), 100);
      return;
    }

    document.getElementById(`cell-${currentRow}-0`).focus();
  }

  buildGrid(parseInt(select.value));
</script>


</body>
</html>
