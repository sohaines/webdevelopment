
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wordle</title>
</head>

<body>
<h1>Wordle</h1>
<label style="font-size:25px; color:dodgerblue;" for="word-select">Choose your game mode:</label>
<select id="word-select" class="game-mode">
  <option value="4">4 letters</option>
  <option value="5">5 letters</option>
  <option value="6">6 letters</option>
</select>

<div contenteditable="true" class="container" id="grid">
</div>
</body>

<style>
  .container {
    display: grid;
    grid-template-columns: repeat(4, auto);
    background-color: #ffffff;
    padding: 10px;
    gap: 5px;
  }
  .container div {
    background-color: #f3f3f3;
    border: 3px solid #b8d8f4;
    padding: 10px;
    font-size: 30px;
    text-align: center;
    width: 50px;
    height: 50px;
  }

  h1 {
    font-size: 50px;
    font-family:'Courier New', Courier, serif;
    text-shadow: #12239e 3px 1px 1px;
    text-align: center;
    border: 3px dodgerblue solid;
    padding: 10px;
    margin: 20px;
    background-color: skyblue;
    color: #cdebf6;
    animation: colorCycle 3s infinite;
  }

  @keyframes colorCycle {
    0%   { color: dodgerblue; }
    25%  { color: royalblue; }
    50%  { color: cornflowerblue; }
    75%  { color: skyblue; }
    100% { color: lightskyblue; }
  }

  .game-mode {
    color: dodgerblue;
    font-size: 18px;
  }

</style>

<script>
  const container = document.getElementById('grid');
  const select = document.getElementById('word-select');

  function buildGrid(wordLength) {
    container.innerHTML = '';
    container.style.gridTemplateColumns = `repeat(${wordLength}, auto)`;

    for (let row = 0; row < 6; row++) {
      for (let col = 0; col < wordLength; col++) {
        let cell = document.createElement('div');
        cell.id = `cell-${row}-${col}`;
        container.appendChild(cell);
      }
    }
  }

  select.addEventListener('change', function() {
    let wordLength = parseInt(select.value);
    buildGrid(wordLength);
  });

  buildGrid(parseInt(select.value));

  document.addEventListener("keypress", function(e) {
    console.log(e.key);
  });
</script>
</html>
