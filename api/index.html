

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CityBike API</title>
</head>
<body>

<h1>CityBike API</h1>
<p style = color:#237aaf; id="status">Loading...</p>
<label style = color:#237aaf; for="city-select">Choose a City:</label>
<select id="city-select">
    <option value="">-- Select a City --</option>
</select>
<div style = color:#237aaf; id="network-list"></div>
</body>

<style>
    h1 {
        color: royalblue;
        font-size: 50px;
        font-family: 'Courier New', Courier, serif;
        text-shadow: #12239e 3px 1px 1px;
        text-align: center;
        border: 3px dodgerblue solid;
        padding: 10px;
        margin: 20px;
        background-color: skyblue;
    }

    .network-list {
        color: #237aaf;
        font-family:'Courier New', Courier, serif;
    }
</style>

<script>
    let url = "https://api.citybik.es/v2/networks";

    fetch(url)
        .then(function(response) {
            if (!response.ok) throw new Error("Failed to fetch: " + response.status);
            return response.json();
        })
        .then(function(data) {
            let networks = data.networks;

            document.getElementById("status").innerHTML = "Showing " + networks.length + " networks";


            let select = document.getElementById("city-select");
            networks.forEach(function(network, index) {
                let option = document.createElement("option");
                option.value = index;
                option.textContent = network.location.city + " (" + network.location.country + ")";
                select.appendChild(option);
            });


            select.addEventListener("change", function() {
                let container = document.getElementById("network-list");
                container.innerHTML = "";

                if (this.value === "") return;

                let network = networks[this.value];
                let div = document.createElement("div");
                div.innerHTML = `
                    <h2>${network.name}</h2>
                    <p>City: ${network.location.city}</p>
                    <p>Country: ${network.location.country}</p>
                `;
                container.appendChild(div);
            });
        })
        .catch(function(error) {
            document.getElementById("status").innerHTML = "Error: " + error.message;
            console.error("Fetch error:", error);
        });
</script>
</html>
