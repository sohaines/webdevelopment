<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>First Page</title>
</head>
<body>
  <h1 id="h1" onclick="changeHeader()">First Page</h1>
    <div class="beggining"></div>

    <ol type="A">
        <li>List item 1</li>
            <ol>
                <li>List item 1a</li>
                <li>List item 1b</li>
                <li>List item 1c</li>
            </ol>
        <li>List item 2</li>
        <li>List item 3</li>
    </ol>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>John</td>
            <td>25</td>
        </tr>

        <tr>
            <td>Mary</td>
            <td>30</td>
        </tr>
    </table>

</body>

<style>
    h1 {
        color: black;
        animation: changeColor 0s forwards;
        animation-delay: 3s;
        text-align: center;
    }

    @keyframes changeColor {
        to {
            color: red;
        }
    }
</style>

<script>
    console.log("Hello");

    let x = 5;
    console.log(x, x+x);
    let y = 5;
    console.log(y, y+y);

    console.log("x+y", y+y);

    x = x+1
    console.log("x", x);

    function changeHeader() {
        let element = document.getElementById("h1");
        console.log(element);
        element.innerText = "This is new text";
        element.style.color = "red";
    }
</script>
</html>
